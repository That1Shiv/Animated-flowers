<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated flower</title>
    <link rel="stylesheet" href="styles.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="not-loaded">
    <h1>Flowers for you Ashniii!!!</h1>

    <div class="flower" id="animation-flower">
      <div class="f-wrapper">
        <div class="flower__line"></div>
        <div class="f">
          <div class="flower__tepal flower__tepal--outer-1"></div>
          <div class="flower__tepal flower__tepal--outer-2"></div>
          <div class="flower__tepal flower__tepal--outer-3 flower__fall-down--yellow"></div>
          <div class="flower__tepal flower__tepal--inner-1"></div>
          <div class="flower__tepal flower__tepal--inner-2"></div>
          <div class="flower__tepal flower__tepal--inner-3"></div>
          <div class="flower__center" aria-hidden="true">
            <span class="flower__stamen"></span>
            <span class="flower__stamen"></span>
            <span class="flower__stamen"></span>
            <span class="flower__stamen"></span>
            <span class="flower__stamen"></span>
            <span class="flower__stamen"></span>
          </div>
        </div>
      </div>

      <div class="f-wrapper f-wrapper--2">
        <div class="flower__line"></div>
        <div class="f">
          <div class="flower__tepal flower__tepal--outer-1"></div>
          <div class="flower__tepal flower__tepal--outer-2"></div>
          <div class="flower__tepal flower__tepal--outer-3"></div>
          <div class="flower__tepal flower__tepal--inner-1"></div>
          <div class="flower__tepal flower__tepal--inner-2 flower__fall-down--pink"></div>
          <div class="flower__tepal flower__tepal--inner-3"></div>
          <div class="flower__center" aria-hidden="true">
            <span class="flower__stamen"></span>
            <span class="flower__stamen"></span>
            <span class="flower__stamen"></span>
            <span class="flower__stamen"></span>
            <span class="flower__stamen"></span>
            <span class="flower__stamen"></span>
          </div>
        </div>
      </div>

      <div class="f-wrapper f-wrapper--3">
        <div class="flower__line"></div>
        <div class="f">
          <div class="flower__tepal flower__tepal--outer-1"></div>
          <div class="flower__tepal flower__tepal--outer-2"></div>
          <div class="flower__tepal flower__tepal--outer-3"></div>
          <div class="flower__tepal flower__tepal--inner-1"></div>
          <div class="flower__tepal flower__tepal--inner-2"></div>
          <div class="flower__tepal flower__tepal--inner-3 flower__fall-down--purple"></div>
          <div class="flower__center" aria-hidden="true">
            <span class="flower__stamen"></span>
            <span class="flower__stamen"></span>
            <span class="flower__stamen"></span>
            <span class="flower__stamen"></span>
            <span class="flower__stamen"></span>
            <span class="flower__stamen"></span>
          </div>
        </div>
      </div>
      <div class="flower__glass"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
